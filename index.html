<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    <meta name="theme-color" content="#FF5A1F" />
    <meta name="description" content="IncidentMind AI — Reliability Command & Organizational Memory Platform" />
    <title>IncidentMind AI — Reliability Command & Organizational Memory</title>
    <script>
      (function() {
        if (typeof window === 'undefined' || typeof document === 'undefined') return;

        // 1. Block iOS Safari pinch gestures
        var preventGesture = function(e) {
          if (e.cancelable) e.preventDefault();
        };
        document.addEventListener('gesturestart', preventGesture, { passive: false });
        document.addEventListener('gesturechange', preventGesture, { passive: false });
        document.addEventListener('gestureend', preventGesture, { passive: false });

        // 2. Block mobile multi-touch pinch zoom (only when 2+ fingers touch)
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (e.cancelable) e.preventDefault();
          }
        }, { passive: false });

        // 3. Block desktop trackpad pinch & Ctrl + Wheel zoom
        window.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            if (e.cancelable) e.preventDefault();
          }
        }, { passive: false });

        // 4. Block desktop keyboard zoom
        window.addEventListener('keydown', function(e) {
          if (e.ctrlKey || e.metaKey) {
            var k = e.key;
            if (k === '+' || k === '-' || k === '=' || k === '_' || k === '0' || e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 107 || e.keyCode === 109 || e.keyCode === 96 || e.keyCode === 48) {
              if (e.cancelable) e.preventDefault();
            }
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
